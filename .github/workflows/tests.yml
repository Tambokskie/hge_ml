name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, iconv, pdo, pdo_mysql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Ghostscript and Tesseract (for OCR extraction tests)
        run: sudo apt-get update && sudo apt-get install -y ghostscript tesseract-ocr

      - name: Resolve OCR tool paths
        run: |
          echo "GHOSTSCRIPT_PATH=$(command -v gs)" >> "$GITHUB_ENV"
          echo "TESSERACT_PATH=$(command -v tesseract)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build CSS
        run: |
          npm ci
          npm run build:css

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 20); do
            mysqladmin ping -h 127.0.0.1 -uroot --silent && break
            sleep 2
          done

      - name: Run PHPUnit
        run: vendor/bin/phpunit
